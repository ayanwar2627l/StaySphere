<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ssGoldMetFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#DFC06E" />
      <stop offset="50%" stopColor="#C99B3B" />
      <stop offset="100%" stopColor="#A87920" />
    </linearGradient>
    <linearGradient id="ssDarkGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#124033" />
      <stop offset="100%" stopColor="#081E18" />
    </linearGradient>
  </defs>

  <!-- Shield Base -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#ssDarkGradFav)" stroke="url(#ssGoldMetFav)" stroke-width="2.5" />

  <!-- Concentric Dotted Ring -->
  <circle cx="50" cy="50" r="38" stroke="url(#ssGoldMetFav)" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.7" />

  <!-- Orbital Ring -->
  <ellipse cx="50" cy="50" rx="34" ry="16" stroke="url(#ssGoldMetFav)" stroke-width="1.6" transform="rotate(-28 50 50)" opacity="0.85" />
  <ellipse cx="50" cy="50" rx="34" ry="16" stroke="url(#ssGoldMetFav)" stroke-width="1.6" transform="rotate(28 50 50)" opacity="0.85" />

  <!-- Central Sanctuary Arch -->
  <path d="M 34 68 L 34 46 C 34 35 41 28 50 25 C 59 28 66 35 66 46 L 66 68" stroke="url(#ssGoldMetFav)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <line x1="28" y1="68" x2="72" y2="68" stroke="url(#ssGoldMetFav)" stroke-width="2.8" stroke-linecap="round" />

  <!-- Star at Apex -->
  <polygon points="50,9 52,14 57,16 52,18 50,23 48,18 43,16 48,14" fill="url(#ssGoldMetFav)" />
  <circle cx="50" cy="16" r="1.5" fill="#FFFFFF" />

  <!-- Center Gem -->
  <circle cx="50" cy="48" r="3" fill="url(#ssGoldMetFav)" />
</svg>
